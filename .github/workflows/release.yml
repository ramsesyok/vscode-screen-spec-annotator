name: Release VSIX

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-vsix
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: quarto-dev/quarto-actions/setup@v2

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Build VSIX
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          asset="${name}-${version}.vsix"
          npm run package:vsix -- --out "$asset"
          test -s "$asset"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: |
          git push origin "${GITHUB_SHA}:refs/tags/${TAG}"
          gh release create "$TAG" "$ASSET" --verify-tag --title "$TAG" --generate-notes
